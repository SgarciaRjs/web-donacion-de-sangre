  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <nav class="navbar navbar-expand-lg navbar-dark" style="background-color: #0a1db3;">
    <div class="container">
      <a class="navbar-brand" href="registro.html">Registro de una nueva persona</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
              data-bs-target="#menuPrincipal" aria-controls="menuPrincipal"
              aria-expanded="false" aria-label="Mostrar menú">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="menuPrincipal">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item">
            <a class="nav-link active" aria-current="page" href="registro.html">Registro</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="agendar.html">Agendar</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="listado.html">Campañas</a>
          </li>

          </li>
        </ul>
      </div>
    </div>
  </nav>

  <section class="form-registro">
    <h2>Registro</h2>

    <label for="nombre">Nombre:</label><br>
    <input type="text" id="nombre"><br><br>

    <label for="apellidos">Apellidos:</label><br>
    <input type="text" id="apellidos"><br><br>

    <label for="email">Correo electrónico:</label><br>
    <input type="email" id="email"><br><br>

    <label for="edad">Edad:</label><br>
    <input type="number" id="edad" min="16"><br><br>

    <label for="sangre">Tipo de sangre:</label><br>
    <select id="sangre">
      <option value="">Seleccione el tipo de sangre</option>
      <option value="A+">A+</option>
      <option value="A-">A-</option>
      <option value="B+">B+</option>
      <option value="B-">B-</option>
      <option value="AB+">AB+</option>
      <option value="AB-">AB-</option>
      <option value="O+">O+</option>
      <option value="O-">O-</option>
    </select><br><br>


    <label for="contrasena">Contraseña</label><br>
<input type="password" id="contrasena" autocomplete="new-password"><br><br>

<label for="confirmarContrasena">Confirmar contraseña</label><br>
<input type="password" id="confirmarContrasena" autocomplete="new-password"><br><br>

    <button onclick="registro()">Registrarse</button>

    <p id="mensaje"></p>

    <p>¿Ya tenes cuenta? <a href="login.html">Inicia sesion aqui</a></p>

  </section>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
