<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Perfil del donante</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <nav class="navbar navbar-dark" style="background-color: #0a1db3;">
    <div class="container">
      <a class="navbar-brand" href="listado.html">Donación de sangre</a>
      <a class="nav-link text-white" href="login.html">Volver al inicio de sesión</a>
    </div>
  </nav>

  <main class="form-registro">
  <h1 class="h2">Mi perfil</h1>
  <p>Perfil de demostración</p>

  <dl id="datosPerfil">
    <dt>Nombre completo</dt>
    <dd id="perfilNombre">Matias Camacho</dd>

    <dt>Correo electrónico</dt>
    <dd id="perfilCorreo">donante@example.com</dd>

    <dt>Edad</dt>
    <dd id="perfilEdad">25 años</dd>

    <dt>Tipo de sangre</dt>
    <dd>A+</dd>
  </dl>

  <button type="button" id="botonEditar">Editar perfil</button>

  <form id="formEditar" hidden>
    <label for="editarNombre">Nombre completo</label>
    <input type="text" id="editarNombre" class="form-control mb-3" required>

    <label for="editarCorreo">Correo electrónico</label>
    <input type="email" id="editarCorreo" class="form-control mb-3" required>

    <label for="editarEdad">Edad</label>
    <input type="number" id="editarEdad" class="form-control mb-3" min="16" required>

    <button type="submit">Guardar cambios</button>
    <button type="button" id="botonCancelar" class="mt-2">Cancelar</button>
  </form>

  <p id="mensajePerfil" class="mt-3" role="status"></p>
</main>

<script>
  const datosPerfil = document.getElementById("datosPerfil");
  const botonEditar = document.getElementById("botonEditar");
  const botonCancelar = document.getElementById("botonCancelar");
  const formulario = document.getElementById("formEditar");
  const mensaje = document.getElementById("mensajePerfil");

  const perfilNombre = document.getElementById("perfilNombre");
  const perfilCorreo = document.getElementById("perfilCorreo");
  const perfilEdad = document.getElementById("perfilEdad");

  const editarNombre = document.getElementById("editarNombre");
  const editarCorreo = document.getElementById("editarCorreo");
  const editarEdad = document.getElementById("editarEdad");

  function mostrarEdicion(editando) {
    formulario.hidden = !editando;
    datosPerfil.hidden = editando;
    botonEditar.hidden = editando;

    if (editando) {
      editarNombre.focus();
    } else {
      botonEditar.focus();
    }
  }

  botonEditar.addEventListener("click", function () {
    editarNombre.value = perfilNombre.textContent;
    editarCorreo.value = perfilCorreo.textContent;
    editarEdad.value = parseInt(perfilEdad.textContent, 10);
    mensaje.textContent = "";
    mostrarEdicion(true);
  });

  botonCancelar.addEventListener("click", function () {
    mostrarEdicion(false);
  });

  formulario.addEventListener("submit", function (evento) {
    evento.preventDefault();

    const nombre = editarNombre.value.trim();
    if (!nombre) {
      mensaje.textContent = "Ingresá el nombre completo.";
      editarNombre.focus();
      return;
    }

    perfilNombre.textContent = nombre;
    perfilCorreo.textContent = editarCorreo.value.trim();
    perfilEdad.textContent = editarEdad.value + " años";

    mostrarEdicion(false);
    mensaje.textContent = "Perfil actualizado.";
  });
</script>
