<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark" style="background-color: #0a1db3;">
    <div class="container">
      <a class="navbar-brand" href="login.html">Donación de sangre</a>

      <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
              data-bs-target="#menuPrincipal" aria-controls="menuPrincipal"
              aria-expanded="false" aria-label="Abrir menú">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="menuPrincipal">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item">
            <a class="nav-link active" href="login.html" aria-current="page">Iniciar sesión</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="registro.html">Registro</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="listado.html">Campañas</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="agendar.html">Agendar</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="consultas.html">Consultas</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="modificar.html">Modificar</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="form-registro">
    <h2>Iniciar sesion</h2>

    <form id="formLogin">
      <label for="email">Correo electronico</label><br>
      <input type="email" id="email" autocomplete="username" required><br><br>

      <label for="contrasena">Contraseña</label><br>
      <input type="password" id="contrasena"
             autocomplete="current-password" required><br><br>

      <button type="submit">Entrar</button>
      <p id="mensajeLogin" class="mt-3" role="status"></p>
    </form>
    
    <p><a href="recuperar.html">¿Olvidaste tu contraseña?</a></p>
    <p>¿No tenes cuenta? <a href="registro.html">Registrate aqui</a></p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    const formulario = document.getElementById("formLogin");
    const mensaje = document.getElementById("mensajeLogin");

    formulario.addEventListener("submit", function (evento) {
      evento.preventDefault();
      mensaje.textContent = "Formulario de inicio de sesion validado.";
    });
  </script>
</body>
</html>
